apiVersion: 1

datasources:
  - name: NetPulse Postgres
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    database: netpulse
    user: netpulse
    secureJsonData:
      password: netpulse
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
  - name: NetPulse Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
