apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: netpulse-grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpulse-grafana
  template:
    metadata:
      labels:
        app: netpulse-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_PANELS_DISABLE_SANITIZE_HTML
          value: "true"
        - name: GF_DASHBOARDS_ALLOW_IN_APP_DASHBOARD_CHANGES
          value: "true"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provisioning
        configMap:
          name: grafana-dashboard-provisioning
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpulse-backend
  template:
    metadata:
      labels:
        app: netpulse-backend
    spec:
      containers:
      - name: backend
        image: netpulse-backend:latest
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "python backend/scripts/run_pipeline.py && while true; do sleep 30; done"]
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "netpulse"
        - name: POSTGRES_USER
          value: "netpulse"
        - name: POSTGRES_PASSWORD
          value: "netpulse"
        - name: OPENAI_API_KEY
          value: "" # Fill this or pass as secret
        - name: OPENAI_API_KEY
          value: "" # Fill this or pass as secret
        - name: OPENAI_MODEL
          value: "gpt-4o-mini"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  ports:
    - port: 8501
      targetPort: 8501
  selector:
    app: netpulse-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpulse-frontend
  template:
    metadata:
      labels:
        app: netpulse-frontend
    spec:
      containers:
      - name: frontend
        image: netpulse-frontend:latest
        imagePullPolicy: Never
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "netpulse"
        - name: POSTGRES_USER
          value: "netpulse"
        - name: POSTGRES_PASSWORD
          value: "netpulse"
        ports:
        - containerPort: 8501

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"