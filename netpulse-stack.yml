apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: netpulse-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager:9093"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    app: netpulse-prometheus
data:
  alerts.yml: |
    groups:
      - name: netpulse-alerts
        rules:
          - alert: NetPulseWatchdog
            expr: vector(1)
            labels:
              severity: info
            annotations:
              summary: "NetPulse alert pipeline watchdog"
              description: "This alert always fires to confirm Prometheus to Alertmanager flow."
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Target down"
              description: "{{ $labels.job }} target {{ $labels.instance }} is down"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    app: netpulse-alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "default"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h

    receivers:
      - name: "default"
---
apiVersion: v1
kind: Secret
metadata:
  name: netpulse-secrets
  labels:
    app: netpulse
type: Opaque
stringData:
  OPENAI_API_KEY: "set-me-via-kubectl-or-ci"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: netpulse-prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-prometheus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: netpulse-prometheus
  template:
    metadata:
      labels:
        app: netpulse-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.0
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=24h
          - --web.enable-lifecycle
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "384Mi"
            cpu: "300m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-rules
        configMap:
          name: prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  type: NodePort
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: netpulse-alertmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-alertmanager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: netpulse-alertmanager
  template:
    metadata:
      labels:
        app: netpulse-alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
          - --config.file=/etc/alertmanager/alertmanager.yml
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: netpulse-grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-grafana
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: netpulse-grafana
  template:
    metadata:
      labels:
        app: netpulse-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_PANELS_DISABLE_SANITIZE_HTML
          value: "true"
        - name: GF_DASHBOARDS_ALLOW_IN_APP_DASHBOARD_CHANGES
          value: "true"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provisioning
        configMap:
          name: grafana-dashboard-provisioning
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: netpulse-backend
  template:
    metadata:
      labels:
        app: netpulse-backend
    spec:
      containers:
      - name: backend
        image: netpulse-backend:latest
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "python backend/scripts/run_pipeline.py && while true; do sleep 30; done"]
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "netpulse"
        - name: POSTGRES_USER
          value: "netpulse"
        - name: POSTGRES_PASSWORD
          value: "netpulse"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: netpulse-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_MODEL
          value: "gpt-4o-mini"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "300m"
---
