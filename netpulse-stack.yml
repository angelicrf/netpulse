apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: netpulse-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpulse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpulse-postgres
  template:
    metadata:
      labels:
        app: netpulse-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: "netpulse"
        - name: POSTGRES_USER
          value: "netpulse"
        - name: POSTGRES_PASSWORD
          value: "netpulse"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: netpulse-grafana
data:
  postgres.yaml: |
    apiVersion: 1

    datasources:
      - name: NetPulse Postgres
        type: postgres
        access: proxy
        url: postgres:5432
        database: netpulse
        user: netpulse
        secureJsonData:
          password: netpulse
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  labels:
    app: netpulse-grafana
data:
  dashboard.yaml: |
    apiVersion: 1

    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
